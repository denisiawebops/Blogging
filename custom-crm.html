<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#0b2742">
  <title>Trutrip CRM</title>
  <style>:root {
  color-scheme: light;
  --navy: #0b2742;
  --navy-2: #123b61;
  --blue: #1f6feb;
  --gold: #d8aa4b;
  --ink: #172334;
  --muted: #64748b;
  --line: #dfe7ef;
  --canvas: #f3f6f9;
  --card: #ffffff;
  --good: #16794a;
  --warn: #9a6700;
  --bad: #b42318;
  --radius: 14px;
  --shadow: 0 10px 30px rgba(11, 39, 66, 0.08);
}

* {
  box-sizing: border-box;
}
html,
body,
#root {
  min-height: 100%;
  margin: 0;
}
body {
  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color: var(--ink);
  background: var(--canvas);
  line-height: 1.45;
}
button,
input,
select,
textarea {
  font: inherit;
}
button {
  cursor: pointer;
}
a {
  color: var(--blue);
}
h1,
h2,
h3,
p {
  margin-top: 0;
}
h1 {
  font-size: clamp(1.55rem, 3vw, 2.2rem);
}
h2 {
  font-size: clamp(1.25rem, 2.4vw, 1.65rem);
}
h3 {
  font-size: 1.05rem;
}

.boot-screen,
.auth-shell {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  background: radial-gradient(
      circle at 12% 12%,
      rgba(216, 170, 75, 0.18),
      transparent 28%
    ),
    linear-gradient(145deg, #061a2c, #123b61);
}
.boot-card,
.auth-card {
  width: min(620px, 100%);
  padding: 30px;
  border-radius: 22px;
  background: rgba(255, 255, 255, 0.98);
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.28);
}
.auth-card {
  position: relative;
  overflow: hidden;
}
.auth-card::after {
  content: "";
  position: absolute;
  width: 180px;
  height: 180px;
  right: -90px;
  top: -90px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(216, 170, 75, 0.2), transparent 68%);
  pointer-events: none;
}
.auth-heading {
  display: grid;
  gap: 10px;
  margin-bottom: 18px;
}
.auth-heading h1,
.auth-heading p {
  margin-bottom: 0;
}
.auth-heading .pill {
  justify-self: start;
}
.auth-form {
  gap: 14px;
}
.auth-recovery-state {
  display: grid;
  justify-items: start;
  gap: 12px;
  padding: 18px;
  border: 1px solid #cfe3d8;
  border-radius: 14px;
  background: #f3fbf7;
}
.auth-recovery-state p {
  margin-bottom: 0;
  color: #355b49;
}
.auth-recovery-icon {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  color: #fff;
  background: var(--good);
  font-size: 1.3rem;
  font-weight: 900;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-mark {
  width: 46px;
  height: 46px;
  border-radius: 13px;
  display: grid;
  place-items: center;
  color: var(--navy);
  background: var(--gold);
  font-weight: 900;
  letter-spacing: -0.04em;
}
.brand-copy strong {
  display: block;
  font-size: 1.08rem;
}
.brand-copy span {
  color: var(--muted);
  font-size: 0.8rem;
}
.boot-progress {
  height: 7px;
  border-radius: 99px;
  overflow: hidden;
  background: #e9eef4;
  margin: 22px 0 12px;
}
.boot-progress::after {
  content: "";
  display: block;
  width: 48%;
  height: 100%;
  background: linear-gradient(90deg, var(--gold), var(--blue));
  animation: boot 1.2s ease-in-out infinite alternate;
}
@keyframes boot {
  to {
    transform: translateX(108%);
  }
}

.app-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 252px 1fr;
}
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 20px 14px;
  color: #fff;
  background: var(--navy);
  display: flex;
  flex-direction: column;
  gap: 18px;
  overflow-y: auto;
}
.sidebar .brand-copy span {
  color: #aec2d3;
}
.nav {
  display: grid;
  gap: 5px;
}
.nav-button {
  width: 100%;
  border: 0;
  border-radius: 10px;
  padding: 10px 12px;
  color: #d8e6f2;
  background: transparent;
  display: flex;
  align-items: center;
  gap: 10px;
  text-align: left;
}
.nav-button:hover,
.nav-button.active {
  color: #fff;
  background: rgba(255, 255, 255, 0.11);
}
.nav-button.active {
  box-shadow: inset 3px 0 0 var(--gold);
}
.nav-icon {
  width: 22px;
  text-align: center;
}
.sidebar-user {
  margin-top: auto;
  padding: 12px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 12px;
}
.sidebar-user small {
  color: #b9cbd9;
}

.main {
  min-width: 0;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 15;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 72px;
  padding: 12px 24px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(14px);
}
.topbar-actions,
.row-actions,
.button-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.content {
  width: min(1500px, 100%);
  margin: 0 auto;
  padding: 24px;
}
.inline-security-panel {
  display: grid;
  gap: 14px;
  margin-top: 16px;
  padding: 16px;
  border: 1px solid #cbd9e6;
  border-radius: 14px;
  background: linear-gradient(145deg, #f8fbfd, #eef4f8);
}
.inline-security-panel h3,
.inline-security-panel p {
  margin-bottom: 0;
}
.page-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 18px;
}
.page-head p {
  color: var(--muted);
  margin-bottom: 0;
}

.banner {
  padding: 11px 14px;
  border-radius: 11px;
  margin-bottom: 14px;
  border: 1px solid;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}
.banner.info {
  background: #eff6ff;
  border-color: #bfdbfe;
  color: #1e40af;
}
.banner.warn {
  background: #fffbeb;
  border-color: #fde68a;
  color: #7c5200;
}
.banner.error {
  background: #fff1f0;
  border-color: #fecaca;
  color: #991b1b;
}
.banner.success {
  background: #ecfdf5;
  border-color: #a7f3d0;
  color: #166534;
}
.content > .banner {
  position: fixed;
  top: 16px;
  left: max(18px, calc(50% - 360px));
  right: 18px;
  width: min(720px, calc(100vw - 36px));
  z-index: 120;
  box-shadow: 0 14px 42px rgba(6, 26, 44, 0.24);
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
}
.card + .card {
  margin-top: 16px;
}
.grid {
  display: grid;
  gap: 16px;
}
.grid-2 {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.grid-3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.grid-4 {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}
.grid-span {
  grid-column: 1 / -1;
}
.kpi {
  min-height: 124px;
  position: relative;
  overflow: hidden;
}
.kpi::after {
  content: "";
  position: absolute;
  width: 88px;
  height: 88px;
  border-radius: 50%;
  right: -24px;
  top: -24px;
  background: rgba(31, 111, 235, 0.08);
}
.kpi-label {
  color: var(--muted);
  font-size: 0.82rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.kpi-value {
  font-size: 2rem;
  font-weight: 800;
  margin-top: 10px;
  color: var(--navy-2);
}

.btn {
  border: 1px solid transparent;
  border-radius: 9px;
  padding: 9px 13px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
}
.btn:disabled {
  opacity: 0.58;
  cursor: wait;
}
.btn-primary {
  background: var(--navy-2);
  color: #fff;
}
.btn-primary:hover {
  background: var(--navy);
}
.btn-secondary {
  background: #fff;
  color: var(--navy-2);
  border-color: #bfcddd;
}
.btn-secondary:hover {
  background: #f7fafc;
}
.btn-gold {
  background: var(--gold);
  color: var(--navy);
}
.btn-danger {
  background: #fff;
  color: var(--bad);
  border-color: #fecaca;
}
.btn-link {
  border: 0;
  background: transparent;
  color: var(--blue);
  padding: 5px;
}
.btn-sm {
  padding: 6px 9px;
  font-size: 0.8rem;
}

.field {
  display: grid;
  gap: 6px;
  align-content: start;
}
.field label {
  font-size: 0.82rem;
  font-weight: 700;
  color: #40566d;
}
.info-icon {
  display: inline-grid;
  place-items: center;
  width: 16px;
  height: 16px;
  margin-left: 6px;
  border-radius: 50%;
  background: #e5eef7;
  color: var(--navy-2);
  font-size: 0.68rem;
  font-style: normal;
  cursor: help;
}
.input,
.select,
.textarea {
  width: 100%;
  min-height: 42px;
  border: 1px solid #cbd7e3;
  border-radius: 9px;
  padding: 9px 11px;
  color: var(--ink);
  background: #fff;
  outline: 0;
}
.textarea {
  resize: vertical;
  min-height: 105px;
}
.input:focus,
.select:focus,
.textarea:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.13);
}
.input[readonly] {
  background: #eef3f7;
  color: #526579;
}
.hint {
  color: var(--muted);
  font-size: 0.78rem;
}
.required::after {
  content: " *";
  color: var(--bad);
}

.table-wrap {
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 11px;
}
table {
  width: 100%;
  border-collapse: collapse;
  min-width: 760px;
}
th,
td {
  padding: 11px 12px;
  text-align: left;
  border-bottom: 1px solid #e8edf2;
  vertical-align: top;
}
th {
  position: sticky;
  top: 0;
  background: #f6f9fb;
  color: #40566d;
  font-size: 0.75rem;
  letter-spacing: 0.035em;
  text-transform: uppercase;
}
tbody tr:hover {
  background: #fbfdff;
}
tbody tr:last-child td {
  border-bottom: 0;
}
.empty {
  color: var(--muted);
  text-align: center;
  padding: 30px;
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 8px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 0.72rem;
  background: #eef3f7;
  color: #40566d;
  white-space: nowrap;
}
.pill.good {
  background: #e8f7ef;
  color: var(--good);
}
.pill.warn {
  background: #fff4d5;
  color: var(--warn);
}
.pill.bad {
  background: #feeceb;
  color: var(--bad);
}
.pill.blue {
  background: #e8f1ff;
  color: #235ea7;
}

.tabs {
  display: flex;
  gap: 6px;
  overflow: auto;
  border-bottom: 1px solid var(--line);
  margin-bottom: 16px;
}
.tab {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-weight: 700;
  padding: 10px 12px;
  white-space: nowrap;
  border-bottom: 3px solid transparent;
}
.tab.active {
  color: var(--navy-2);
  border-color: var(--gold);
}

.pipeline {
  display: grid;
  grid-template-columns: repeat(6, minmax(100px, 1fr));
  gap: 8px;
  overflow: auto;
}
.pipeline-step {
  min-width: 110px;
  padding: 11px;
  border-radius: 10px;
  background: #eef3f7;
}
.pipeline-step strong {
  display: block;
  color: var(--navy-2);
  font-size: 0.82rem;
}
.pipeline-step span {
  color: var(--muted);
  font-size: 0.76rem;
}

.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(6, 26, 44, 0.64);
  display: grid;
  place-items: center;
  padding: 18px;
}
.modal {
  width: min(960px, 100%);
  max-height: 92vh;
  overflow: auto;
  background: #fff;
  border-radius: 18px;
  box-shadow: 0 30px 90px rgba(0, 0, 0, 0.35);
}
.modal-head {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  gap: 16px;
  align-items: center;
  padding: 16px 20px;
  background: #fff;
  border-bottom: 1px solid var(--line);
}
.modal-body {
  padding: 20px;
}
.modal-foot {
  position: sticky;
  bottom: 0;
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 14px 20px;
  background: #fff;
  border-top: 1px solid var(--line);
}

.email-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 16px;
}
.email-preview {
  min-height: 280px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  overflow: hidden;
}
.email-preview iframe {
  width: 100%;
  height: 360px;
  border: 0;
}
.format-toggle {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin: 14px 0;
}
.format-choice {
  display: grid;
  gap: 4px;
  padding: 13px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
}
.format-choice span {
  color: var(--muted);
  font-size: 12px;
}
.format-choice.active {
  border-color: var(--navy);
  background: #eef5fb;
  box-shadow: 0 0 0 2px rgba(18, 53, 91, 0.1);
}
@media (max-width: 620px) {
  .format-toggle {
    grid-template-columns: 1fr;
  }
}
.drop-zone {
  border: 2px dashed #bdcad8;
  border-radius: 11px;
  padding: 20px;
  text-align: center;
  color: var(--muted);
  background: #f8fafc;
}
.mapping-row {
  display: grid;
  grid-template-columns: 32px minmax(130px, 0.7fr) minmax(220px, 1.4fr) auto;
  gap: 10px;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid #edf1f5;
}
.mapping-row.has-conflict {
  margin-inline: -8px;
  padding-inline: 8px;
  border-radius: 9px;
  background: #fff5db;
}
.workflow-stepper {
  display: grid;
  grid-template-columns: repeat(5, minmax(145px, 1fr));
  gap: 8px;
  margin: 0 0 16px;
  padding: 0;
  list-style: none;
  overflow-x: auto;
}
.workflow-stepper li {
  min-width: 145px;
}
.workflow-stepper button {
  width: 100%;
  min-height: 62px;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  color: var(--muted);
  text-align: left;
}
.workflow-stepper button span {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 50%;
  background: #e8eef4;
  color: var(--navy-2);
  font-weight: 850;
}
.workflow-stepper .current button {
  border-color: var(--gold);
  background: #fffaf0;
  color: var(--navy-2);
  box-shadow: 0 5px 18px rgba(184, 134, 43, 0.12);
}
.workflow-stepper .current button span {
  background: var(--gold);
  color: #fff;
}
.workflow-stepper .complete button span {
  background: var(--good);
  color: #fff;
}
.request-summary {
  display: grid;
  grid-template-columns: repeat(5, minmax(130px, 1fr));
  gap: 1px;
  overflow: auto;
  border: 1px solid #d6e2ec;
  border-radius: 14px;
  background: #d6e2ec;
  margin-bottom: 14px;
}
.request-summary > div {
  min-width: 130px;
  display: grid;
  gap: 4px;
  padding: 11px;
  background: #f8fbfd;
}
.request-summary span {
  color: var(--muted);
  font-size: 0.7rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.045em;
}
.request-summary strong {
  color: var(--navy-2);
  font-size: 0.84rem;
}
.stage-four-summary {
  grid-template-columns: repeat(6, minmax(150px, 1fr));
  margin-bottom: 18px;
}
.stage-four-summary > button {
  margin: 9px;
  align-self: center;
}
.workbook-accordion {
  border: 1px solid #d9e4ed;
  border-radius: 14px;
  background: #fff;
  overflow: hidden;
}
.workbook-accordion > summary {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 15px;
  cursor: pointer;
  color: var(--navy-2);
  background: #f6f9fc;
  font-weight: 850;
  list-style: none;
}
.workbook-accordion > summary::-webkit-details-marker {
  display: none;
}
.workbook-accordion > summary span {
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--navy-2);
  color: #fff;
}
.workbook-accordion > .form-section {
  margin: 12px;
}
.audit-table-wrap {
  overflow: auto;
  margin: 0 12px 12px;
}
.data-table.compact {
  min-width: 900px;
}
.email-studio {
  display: grid;
  gap: 14px;
  width: 100%;
  min-width: 0;
  overflow: hidden;
}
.email-studio > *,
.email-header-grid > * {
  min-width: 0;
}
.email-header-grid {
  align-items: end;
}
.editor-tabs {
  display: flex;
  gap: 4px;
  max-width: 100%;
  overflow-x: auto;
  border-bottom: 1px solid var(--line);
}
.editor-tabs button {
  flex: 0 0 auto;
  padding: 9px 14px;
  border: 0;
  border-bottom: 3px solid transparent;
  background: transparent;
  color: var(--muted);
  font-weight: 800;
}
.editor-tabs button.active {
  color: var(--navy-2);
  border-color: var(--gold);
}
.editor-toolbar {
  position: sticky;
  top: 64px;
  z-index: 1;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 5px;
  width: 100%;
  max-width: 100%;
  padding: 9px;
  border: 1px solid #cfdae5;
  border-bottom: 0;
  border-radius: 12px 12px 0 0;
  background: rgba(248, 251, 253, 0.97);
  backdrop-filter: blur(10px);
}
.editor-tool {
  flex: 0 0 auto;
  min-height: 32px;
  padding: 5px 8px;
  border: 1px solid #d5e0e9;
  border-radius: 7px;
  background: #fff;
  color: #263b50;
  font-size: 0.74rem;
  font-weight: 750;
}
.editor-tool:hover,
.editor-tool:focus-visible {
  border-color: var(--blue);
  background: #edf6ff;
}
.rich-editor {
  width: 100%;
  min-width: 0;
  min-height: 390px;
  max-height: 68vh;
  overflow: auto;
  overscroll-behavior: contain;
  overflow-wrap: anywhere;
  -webkit-overflow-scrolling: touch;
  padding: 20px;
  border: 1px solid #cfdae5;
  border-radius: 0 0 12px 12px;
  background: #fff;
  color: #172334;
  line-height: 1.55;
  outline: none;
}
.rich-editor:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(49, 118, 181, 0.12);
}
.rich-editor table {
  width: max-content;
  min-width: 100%;
  max-width: none;
  table-layout: auto;
  border-collapse: collapse;
  margin: 12px 0;
}
.rich-editor th,
.rich-editor td {
  min-width: 90px;
  height: 38px;
  padding: 8px 10px;
  border: 1px solid #bac8d5;
  vertical-align: top;
  white-space: normal;
  overflow-wrap: break-word;
}
.rich-editor th {
  position: static;
  top: auto;
  background: #12355b;
  color: #fff;
  font-size: inherit;
  letter-spacing: normal;
  text-transform: none;
}
.email-table-wrap {
  display: block;
  width: 100%;
  max-width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  overscroll-behavior-inline: contain;
  -webkit-overflow-scrolling: touch;
}
.email-preview-large,
.email-preview-large iframe {
  min-height: 520px;
  height: 62vh;
}
.studio-actions {
  position: sticky;
  bottom: -20px;
  z-index: 2;
  padding: 10px;
  margin-inline: -8px;
  border-top: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(8px);
}
.safe-link {
  display: block;
  max-width: 640px;
  margin-top: 3px;
  overflow: hidden;
  color: var(--blue);
  font-size: 0.78rem;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.mapping-row:last-child {
  border-bottom: 0;
}

.metric-list {
  display: grid;
  gap: 9px;
}
.metric-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 0;
  border-bottom: 1px solid #edf1f5;
}
.metric-row:last-child {
  border-bottom: 0;
}
.money {
  font-variant-numeric: tabular-nums;
  font-weight: 800;
}
.internal {
  border-left: 4px solid #7c3aed;
  background: #faf7ff;
}
.customer {
  border-left: 4px solid var(--good);
}
.eyebrow {
  display: block;
  color: #557089;
  font-size: 0.7rem;
  font-weight: 850;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.card-title-row,
.section-heading,
.option-group-head,
.review-brand {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
}
.card-title-row h2,
.card-title-row h3,
.section-heading h3,
.option-group-head h3 {
  margin-bottom: 3px;
}
.release-chip {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 7px 10px;
  border: 1px solid #c8d6e3;
  border-radius: 999px;
  background: #fff;
  color: #526579;
  font-size: 0.78rem;
}
.release-chip strong {
  color: var(--navy-2);
}
.intake-layout {
  display: grid;
  grid-template-columns: minmax(420px, 0.82fr) minmax(520px, 1.18fr);
  gap: 18px;
  align-items: start;
}
.intake-layout > .card {
  min-width: 0;
  max-width: 100%;
  overflow: hidden;
}
.form-card {
  padding: 0;
  overflow: hidden;
}
.form-card > .card-title-row {
  padding: 20px 22px 14px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, #fff, #f9fbfd);
}
.form-stack {
  display: grid;
  gap: 14px;
  padding: 18px;
}
.form-section {
  border: 1px solid #dbe5ee;
  border-radius: 14px;
  padding: 16px;
  background: #fff;
}
.form-section .section-heading {
  margin-bottom: 14px;
}
.section-heading p {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: 0.82rem;
}
.sticky-actions {
  position: sticky;
  bottom: 0;
  z-index: 3;
  display: flex;
  gap: 9px;
  padding: 14px 18px;
  border-top: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(12px);
}
.inline-control,
.search-row {
  display: flex;
  gap: 8px;
  align-items: center;
}
.inline-control .input,
.search-row .input {
  flex: 1;
  min-width: 0;
}
.check-line {
  display: flex !important;
  align-items: center;
  gap: 7px;
  color: #526579 !important;
  font-weight: 600 !important;
  font-size: 0.78rem !important;
}
.context-note {
  align-self: end;
  min-height: 42px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 11px;
  border-radius: 9px;
  background: #eef5fb;
  color: #40566d;
  font-size: 0.82rem;
}
.search-results {
  display: grid;
  gap: 7px;
  margin-top: 10px;
  max-height: 260px;
  overflow: auto;
}
.search-results button,
.master-list button {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  padding: 10px 11px;
  border: 1px solid #dfe7ef;
  border-radius: 10px;
  background: #f9fbfd;
  text-align: left;
  color: var(--ink);
}
.search-results button:hover,
.master-list button:hover {
  border-color: #8fb5d6;
  background: #f0f7fd;
}
.search-results span,
.master-list small {
  display: block;
  color: var(--muted);
  font-size: 0.77rem;
}
.calc-strip {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin-top: 14px;
  padding: 11px;
  border: 1px solid #cfe3d9;
  border-radius: 12px;
  background: #f0faf5;
}
.calc-strip > div {
  display: grid;
  gap: 3px;
}
.calc-strip span {
  color: #5d7368;
  font-size: 0.72rem;
  font-weight: 750;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.calc-strip strong {
  color: #135f3b;
  font-size: 1rem;
  font-variant-numeric: tabular-nums;
}
.internal-strip {
  background: #f7f2ff;
  border-color: #dfd2f6;
}
.internal-strip span {
  color: #6f5a8c;
}
.internal-strip strong {
  color: #5c3387;
}
.staged-review {
  margin-top: 16px;
  padding: 16px;
  border: 1px solid #f1d897;
  border-radius: 13px;
  background: #fffcf2;
}
.drop-zone.dragging {
  border-color: var(--blue);
  background: #eaf3ff;
  color: #1e5f9c;
}
.visibility-legend {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  padding: 10px 12px;
  border-radius: 11px;
  background: #f6f9fb;
  color: var(--muted);
  font-size: 0.76rem;
  margin-bottom: 14px;
}
.option-group {
  margin-top: 16px;
}
.option-group-head {
  align-items: center;
  margin-bottom: 8px;
}
.order-control {
  display: flex;
  align-items: center;
  gap: 6px;
}
.order-control strong {
  min-width: 22px;
  text-align: center;
}
.kpi-inline {
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 0;
}
.kpi-inline span {
  color: var(--muted);
}
.kpi-inline strong {
  font-size: 2rem;
  color: var(--navy-2);
}
.modal-form {
  display: grid;
  gap: 14px;
}
.record-list,
.master-list {
  display: grid;
  gap: 7px;
  margin-top: 14px;
  max-height: 360px;
  overflow: auto;
}
.record-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid #edf1f5;
}
.record-row:last-child {
  border-bottom: 0;
}
.document-card {
  position: relative;
  overflow: hidden;
  padding-left: 78px;
  min-height: 220px;
}
.document-icon {
  position: absolute;
  left: 18px;
  top: 18px;
  width: 44px;
  height: 52px;
  display: grid;
  place-items: center;
  border-radius: 8px 8px 12px 8px;
  background: linear-gradient(150deg, var(--navy-2), var(--blue));
  color: #fff;
  font-size: 1.25rem;
  font-weight: 900;
  box-shadow: 0 10px 20px rgba(31, 111, 235, 0.22);
}
.review-sheet {
  border: 1px solid #dbe5ee;
  border-radius: 15px;
  padding: 24px;
  background: #fff;
  box-shadow: 0 12px 32px rgba(11, 39, 66, 0.08);
}
.review-brand {
  padding-bottom: 18px;
  border-bottom: 2px solid var(--navy-2);
  margin-bottom: 8px;
}
.review-row {
  display: grid;
  grid-template-columns: minmax(150px, 0.45fr) minmax(0, 1fr);
  gap: 18px;
  padding: 9px 0;
  border-bottom: 1px solid #edf1f5;
}
.review-row span {
  color: var(--muted);
}
.review-row strong {
  text-align: right;
}
.review-cancellation {
  margin-top: 24px;
  padding: 16px;
  border-radius: 12px;
  background: #fff7e6;
  border: 1px solid #f1d897;
}
.review-cancellation h3 {
  margin-bottom: 8px;
}
.bars {
  display: grid;
  gap: 12px;
}
.bar-label {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 5px;
  font-size: 0.82rem;
}
.bar-track {
  height: 8px;
  overflow: hidden;
  border-radius: 99px;
  background: #e9eef4;
}
.bar-track span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--navy-2), var(--blue));
}
.master-admin {
  display: grid;
  gap: 16px;
}
.muted {
  color: var(--muted);
}
.small {
  font-size: 0.8rem;
}
.right {
  text-align: right;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.mobile-nav {
  display: none;
}
@media (max-width: 1280px) {
  .intake-layout {
    grid-template-columns: 1fr;
  }
}
@media (max-width: 1050px) {
  .app-shell {
    grid-template-columns: 82px 1fr;
  }
  .sidebar .brand-copy,
  .sidebar-user,
  .nav-label {
    display: none;
  }
  .sidebar {
    align-items: center;
  }
  .nav-button {
    justify-content: center;
    padding: 11px;
  }
  .grid-4 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (max-width: 760px) {
  .app-shell {
    display: block;
    padding-bottom: 68px;
  }
  .sidebar {
    display: none;
  }
  .mobile-nav {
    display: flex;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 50;
    background: var(--navy);
    padding: 7px;
    justify-content: space-around;
    box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.18);
  }
  .mobile-nav .nav-button {
    width: auto;
    display: grid;
    gap: 1px;
    justify-items: center;
    font-size: 0.65rem;
    padding: 5px 8px;
  }
  .mobile-nav .nav-label {
    display: block;
  }
  .topbar {
    padding: 10px 14px;
  }
  .content {
    padding: 16px 12px;
  }
  .page-head {
    display: block;
  }
  .page-head .button-row {
    margin-top: 12px;
  }
  .grid-2,
  .grid-3,
  .grid-4,
  .email-grid,
  .calc-strip {
    grid-template-columns: 1fr;
  }
  .modal-backdrop {
    padding: 0;
    align-items: end;
  }
  .modal {
    width: 100%;
    border-radius: 18px 18px 0 0;
    max-height: 95vh;
  }
  .modal-head,
  .modal-body,
  .modal-foot {
    padding-inline: 14px;
  }
  .mapping-row {
    grid-template-columns: 28px 1fr;
  }
  .mapping-row > :nth-child(n + 3) {
    grid-column: 2;
  }
  .request-summary,
  .stage-four-summary {
    grid-template-columns: repeat(6, minmax(150px, 1fr));
  }
  .workflow-stepper {
    grid-template-columns: repeat(5, minmax(150px, 1fr));
  }
  .editor-toolbar {
    position: static;
    max-height: 220px;
    overflow-x: hidden;
    overflow-y: auto;
  }
  .rich-editor {
    min-height: 320px;
    padding: 14px;
  }
  .rich-editor th,
  .rich-editor td {
    min-width: 112px;
    padding: 8px;
  }
  .studio-actions {
    position: static;
  }
  .inline-control,
  .search-row,
  .record-row {
    align-items: stretch;
    flex-direction: column;
  }
  .review-row {
    grid-template-columns: 1fr;
    gap: 3px;
  }
  .review-row strong {
    text-align: left;
  }
  .document-card {
    padding-left: 18px;
    padding-top: 82px;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}
.company-groups {
  display: grid;
  gap: 12px;
  margin-top: 16px;
}
.company-group {
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fff;
  overflow: hidden;
}
.company-group-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border: 0;
  background: #f8fafc;
  color: var(--navy);
  text-align: left;
  cursor: pointer;
}
.company-group-toggle:hover {
  background: #eef4f8;
}
.company-group-chevron {
  width: 18px;
  flex: 0 0 18px;
  font-size: 18px;
}
.company-group-title {
  display: grid;
  gap: 2px;
  flex: 1;
  min-width: 0;
}
.company-lead-table {
  border-top: 1px solid var(--line);
}
@media print {
  .sidebar,
  .topbar,
  .mobile-nav,
  .no-print,
  .btn {
    display: none !important;
  }
  .app-shell {
    display: block;
  }
  .content {
    padding: 0;
  }
  .card {
    box-shadow: none;
    border: 0;
  }
  .table-wrap {
    overflow: visible;
  }
}
